name: drift

# Published numbers keep looking authoritative long after the tools they describe have
# moved on. Once a month, ask the registries which scanners have shipped a new version
# since the results were measured, and open an issue when any of them has.
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which scanners have moved
        id: check
        run: |
          set +e
          python3 tools/check-drift.py > drift.txt 2>&1
          echo "drifted=$?" >> "$GITHUB_OUTPUT"
          cat drift.txt

      # One open issue, edited in place. A monthly job that opens a new issue every
      # month produces a wall of duplicates nobody reads.
      - name: Report it
        if: steps.check.outputs.drifted == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'Upstream has moved since \`harness/results-latest.json\` was generated.\n\n\`\`\`\n%s\n\`\`\`\n\nRe-run: \`tools/setup-adapters.sh\` then \`python harness/run.py\`, and regenerate the card.\n\n_Checked automatically on %s._' "$(cat drift.txt)" "$(date -u +%Y-%m-%d)")"
          existing="$(gh issue list --state open --label upstream-drift --limit 1 --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh label create upstream-drift --color FBCA04 --description "A measured scanner has released a new version" 2>/dev/null || true
            gh issue create --title "Scanners have moved since the last run" --label upstream-drift --body "$body"
          fi
