id: unreachable-sink-001
language: python
verdict: safe
class: null
title: Dangerous shell sink present, reached by no exposed tool

sink: null

surfaces: [source, runtime]

entry:
  tool: refresh_cache
  parameter: branch
  reachable: false

proof:
  tool: refresh_cache
  args:
    branch: '; echo MCPBENCH""_OK'
  oracle: MCPBENCH_OK
  expect: absent

pair: unreachable-sink-001-reachable
notes: >
  subprocess.run(..., shell=True) on an interpolated argument sits in _run_maintenance
  and is as dangerous as any sink in this corpus. Nothing calls it. Every exposed tool
  reads the dict, including refresh_cache, which in the twin is the one that reaches it.

  The proof calls refresh_cache rather than some unrelated tool, so it tests the claim
  the case actually makes: the same tool, taking the same argument, does not reach the
  sink here.

  This is the reachability test. A scanner that pattern-matches sinks reports a critical
  finding; one that resolves paths from tool handlers reports nothing. The pair differs
  in exactly one line of code.
