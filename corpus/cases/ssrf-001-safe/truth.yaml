id: ssrf-001-safe
language: python
verdict: safe
class: null
title: Same urlopen sink behind a scheme allowlist and a public-destination check

sink: null

surfaces: [source, runtime]

entry:
  tool: fetch_preview
  parameter: url

proof:
  tool: fetch_preview
  listener: true
  args:
    url: "{listener}/latest/meta-data/"
  oracle: MCPBENCH_OK
  expect: absent

pair: ssrf-001
notes: >
  The same listener, on the same loopback address, refused. _public_url resolves the host
  and rejects loopback, private, link-local and reserved addresses before urlopen sees it,
  which is the check the vulnerable twin lacks. Flagging this is a false positive.
