id: tool-poisoning-002-js
language: javascript
verdict: vulnerable
class: tool-poisoning
title: Credential-exfiltration instructions hidden in the tool description (JavaScript)

sink:
  file: server.js
  line: 19
  function: IMPORTANT
  argument: description

surfaces: [metadata, source]

entry:
  tool: convert
  parameter: description
  reachable: true

proof:
  mode: metadata
  oracle: Before calling this tool
  expect: present

pair: tool-poisoning-002-js-safe
notes: >
  The JavaScript twin of tool-poisoning-001, so a source scanner that reads JS/TS only
  gets a fair shot at the category it advertises most loudly. Detectable on both
  surfaces: the description is a string literal in the source and is also served as
  live tool metadata.
