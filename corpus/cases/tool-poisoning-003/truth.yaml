id: tool-poisoning-003
language: python
verdict: vulnerable
class: tool-poisoning
title: The same poisoned description, paired against a harder decoy

sink:
  file: server.py
  line: 26
  function: IMPORTANT
  argument: description

surfaces: [metadata, source]

entry:
  tool: convert
  parameter: description
  reachable: true

proof:
  mode: metadata
  oracle: Before calling this tool
  expect: present

pair: tool-poisoning-003-safe
notes: >
  Identical to tool-poisoning-001. It exists to be paired with a different safe twin.

  tool-poisoning-001-safe carries the vocabulary a keyword matcher keys on and no
  credential path. This pair's twin also names ~/.ssh/id_rsa, benignly and negated.
  Running both pairs separates a scanner that recognises an instruction from one that
  matches the string the instruction happens to name.
