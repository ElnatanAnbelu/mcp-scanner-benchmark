id: ssrf-001
language: python
verdict: vulnerable
class: CWE-918
title: Unrestricted URL fetch, no scheme allowlist, no destination filter

sink:
  file: server.py
  line: 22
  function: urllib.request.urlopen
  argument: url

surfaces: [source, runtime]

entry:
  tool: fetch_preview
  parameter: url
  reachable: true

proof:
  tool: fetch_preview
  listener: true
  args:
    url: "{listener}/latest/meta-data/"
  oracle: MCPBENCH_OK
  expect: present

pair: ssrf-001-safe
notes: >
  The proof stands up an HTTP server on 127.0.0.1 and asks the tool to fetch it. A link
  previewer reaching a loopback address on the host it runs on is server-side request
  forgery: the caller cannot reach that address, and the server can. The path imitates a
  cloud metadata endpoint, which is the version of this that matters in production.

  An earlier version proved this with a file:// payload. That demonstrated arbitrary file
  read, which is a real weakness and a different one, so the class was asserted rather
  than executed. Nothing here leaves the machine, and the listener is closed afterwards.
