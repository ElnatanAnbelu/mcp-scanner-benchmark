id: unreachable-sink-001-reachable
language: python
verdict: vulnerable
class: CWE-78
title: The same shell sink, reached by one line

sink:
  file: server.py
  line: 43
  function: _run_maintenance
  argument: command

surfaces: [source, runtime]

entry:
  tool: refresh_cache
  parameter: branch
  reachable: true

proof:
  tool: refresh_cache
  args:
    branch: '; echo MCPBENCH""_OK'
  oracle: MCPBENCH_OK
  expect: present

pair: unreachable-sink-001
notes: >
  The same helper, the same sink, the same three tools with the same names, signatures
  and docstrings as the safe twin. One line differs: refresh_cache passes its argument
  to _run_maintenance instead of reading the dict.

  Earlier versions of this pair swapped a no-argument tool for one taking a string,
  which confounded reachability with "has a caller-controlled parameter". A scanner
  could have discriminated the pair without reasoning about reachability at all.
