id: tool-poisoning-001-safe
language: python
verdict: safe
class: null
title: Same tool, security vocabulary in the description, no instruction to the client

sink: null

surfaces: [metadata, source]

entry:
  tool: convert
  parameter: description
  reachable: false

proof:
  mode: metadata
  oracle: Before calling this tool
  expect: absent

pair: tool-poisoning-001
notes: >
  The description talks about audit files, compliance review, credentials and what
  is "important", and it names ~/.ssh/id_rsa in a benign, negated context: this tool
  never reads it. That is deliberate. ramparts flags the vulnerable twin with a YARA
  rule called SSHKeyExposure, which matches the literal path, so a decoy without that
  path would never have tested whether the rule can tell an instruction from a mention.

  The oracle is "Before calling this tool" rather than the path, since the path now
  appears in both twins and the instruction appears in only one. Tool poisoning is the
  instruction, not the string it names.
